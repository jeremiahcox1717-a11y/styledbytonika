<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Book Your Appointment | Styled by Tonika</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=50" />
</head>
<body class="book-page">
  <header class="book-top">
    <a class="neon book-logo" href="index.html">Styled by Tonika</a>
    <div class="book-top-actions">
      <a class="book-back" href="index.html">Home</a>
      <a class="nav-ig" data-ig-link href="https://www.instagram.com/styled-by-tonika/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm0 2a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H7Zm10.2 1.3a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2ZM12 8.2A3.8 3.8 0 1 1 8.2 12 3.8 3.8 0 0 1 12 8.2Zm0 2a1.8 1.8 0 1 0 1.8 1.8A1.8 1.8 0 0 0 12 10.2Z"/>
        </svg>
        <span>Instagram</span>
      </a>
    </div>
  </header>

  <section class="book">
    <p class="kicker">Reserve your chair</p>
    <h1 class="neon">Book Your Appointment</h1>
    <p class="book-lede" data-field="book-lede">
      Pick a service and a time that works. A non-refundable $25 deposit holds
      your spot and goes toward your balance. Remaining balance is cash only.
    </p>

    <form class="book-form" id="booking-form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
      </div>
      <div class="field">
        <label for="service">Service</label>
        <select id="service" name="service" required>
          <option value="" disabled selected>Select a service</option>
          <option>Locs</option>
          <option>Mens styles</option>
          <option>Wig Installation</option>
          <option>Quick weaves</option>
          <option>Feed in cornrows</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="date">Preferred date</label>
          <input id="date" name="date" type="date" required />
        </div>
        <div class="field">
          <label for="time">Preferred time</label>
          <select id="time" name="time" required>
            <option value="" disabled selected>Select a date first</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="notes">Notes <span class="optional">(optional)</span></label>
        <textarea id="notes" name="notes" rows="4" placeholder="Hair length, style inspo, travel location…"></textarea>
      </div>
      <label class="check">
        <input type="checkbox" id="deposit" name="deposit" required />
        <span>I understand a non-refundable $25 deposit is required, and the remaining balance is cash only.</span>
      </label>
      <p class="form-error" id="form-error" hidden></p>
      <button class="submit" type="submit">Request Appointment</button>
    </form>
  </section>

  <div class="modal" id="success-modal" hidden>
    <div class="modal-card" role="dialog" aria-labelledby="success-title" aria-modal="true">
      <p class="kicker">You’re on the list</p>
      <h2 class="neon" id="success-title">Request received</h2>
      <p id="success-copy"></p>
      <a class="submit" href="index.html">Back to home</a>
    </div>
  </div>

  <script src="site-content.js?v=2"></script>
  <script src="script.js?v=5"></script>
</body>
</html>
