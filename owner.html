<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Owner Access | Styled by Tonika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=47" />
  <link rel="stylesheet" href="owner.css?v=4" />
</head>
<body class="owner-page">
  <div class="owner-gate">
    <p class="kicker">Private studio</p>
    <h1 class="neon">Owner access</h1>
    <p id="gate-copy" class="owner-lede">Enter your owner password to open the studio and talk to the site bot.</p>
    <form id="gate-form" class="owner-gate-form">
      <label for="owner-pass">Password</label>
      <input id="owner-pass" type="password" autocomplete="current-password" required />
      <label id="pass-confirm-wrap" hidden>
        Confirm password
        <input id="owner-pass-2" type="password" autocomplete="new-password" />
      </label>
      <p id="gate-error" class="form-error" hidden></p>
      <button class="submit" type="submit" id="gate-submit">Unlock</button>
    </form>
    <a class="owner-back" href="index.html">Back to public site</a>
  </div>

  <script src="owner-config.js?v=2"></script>
  <script src="owner-auth.js?v=2"></script>
  <script src="owner.js?v=6"></script>
</body>
</html>
